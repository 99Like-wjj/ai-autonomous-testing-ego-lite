<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="谁负责什么？"><title>谁负责什么？</title><defs><linearGradient id="g"><stop stop-color="#61e6ed"/><stop offset="1" stop-color="#ae91ff"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#61e6ed"/></marker></defs><g font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="650" rx="0" fill="#080e20" stroke="#080e20"/><path d="M0,2 H1200" stroke="url(#g)" stroke-width="4"/><text x="50" y="65" font-size="35" fill="#f1f5ff" font-weight="700">AI 做判断，Ego 做操作，工具管记录。</text><text x="50" y="103" font-size="20" fill="#9cacc8" font-weight="400">复用当前 AI 会话和 Ego 浏览器，不另建模型 API 服务。</text><rect x="430" y="150" width="340" height="268" rx="18" fill="#101b32" stroke="#293957"/><text x="454" y="192" font-size="20" fill="#61e6ed" font-weight="700">02</text><text x="454" y="236" font-size="22" fill="#f1f5ff" font-weight="700">当前 AI 会话</text><text x="454" y="284" font-size="19" fill="#9cacc8" font-weight="400">理解测试需求</text><text x="454" y="322" font-size="19" fill="#9cacc8" font-weight="400">规划测试并调整操作</text><text x="454" y="360" font-size="19" fill="#9cacc8" font-weight="400">判断证据是否充分</text><rect x="50" y="150" width="340" height="268" rx="18" fill="#101b32" stroke="#293957"/><text x="74" y="192" font-size="20" fill="#ae91ff" font-weight="700">01</text><text x="74" y="236" font-size="22" fill="#f1f5ff" font-weight="700">本项目 Skill + 测试资料</text><text x="74" y="284" font-size="19" fill="#9cacc8" font-weight="400">授权边界与验收条件</text><text x="74" y="322" font-size="19" fill="#9cacc8" font-weight="400">需求、业务规则与用例</text><text x="74" y="360" font-size="19" fill="#9cacc8" font-weight="400">可灵活调整的流程指南</text><rect x="810" y="150" width="340" height="268" rx="18" fill="#101b32" stroke="#293957"/><text x="834" y="192" font-size="20" fill="#61e6ed" font-weight="700">03</text><text x="834" y="236" font-size="22" fill="#f1f5ff" font-weight="700">Ego 原生浏览器能力</text><text x="834" y="284" font-size="19" fill="#9cacc8" font-weight="400">读取当前页面</text><text x="834" y="322" font-size="19" fill="#9cacc8" font-weight="400">执行浏览器操作</text><text x="834" y="360" font-size="19" fill="#9cacc8" font-weight="400">返回页面信息与截图</text><path d="M390,276 L428,276" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M770,260 L808,260" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M808,302 L770,302" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="78" y="444" font-size="16" fill="#ae91ff" font-weight="400">提供规则与测试目标 →</text><text x="454" y="444" font-size="16" fill="#61e6ed" font-weight="400">选择操作 ↔ 读取结果</text><rect x="50" y="462" width="1100" height="130" rx="18" fill="#101b32" stroke="#293957"/><text x="78" y="503" font-size="23" fill="#61e6ed" font-weight="700">本项目工具箱：登记证据、保存结果、生成报告。</text><text x="78" y="543" font-size="21" fill="#f1f5ff" font-weight="400">工具校验文件和记录，不替 AI 判定业务是否正确。</text><text x="78" y="574" font-size="18" fill="#9cacc8" font-weight="400">操作成功不等于测试通过，仍需对照预期核验结果。</text></g></svg>