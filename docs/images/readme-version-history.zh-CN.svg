<svg xmlns="http://www.w3.org/2000/svg" width="840" height="650" viewBox="0 0 840 650" role="img" aria-label="最近四个版本 — README 概览"><title>最近四个版本 — README 概览</title><defs><linearGradient id="g"><stop stop-color="#61e6ed"/><stop offset="1" stop-color="#ae91ff"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#61e6ed"/></marker></defs><g font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="840" height="650" rx="0" fill="#080e20" stroke="#080e20"/><path d="M0,2 H840" stroke="url(#g)" stroke-width="4"/><text x="48" y="65" font-size="32" fill="#f1f5ff" font-weight="700">最新版本与前三个历史版本</text><rect x="48" y="100" width="744" height="106" rx="18" fill="#101b32" stroke="#61e6ed"/><text x="72" y="134" font-size="25" fill="#61e6ed" font-weight="700">v0.1.3</text><text x="430" y="133" font-size="19" fill="#9cacc8" font-weight="400">正式版</text><text x="72" y="178" font-size="27" fill="#f1f5ff" font-weight="700">证据与报告完整交付</text><rect x="48" y="222" width="744" height="106" rx="18" fill="#101b32" stroke="#61e6ed"/><text x="72" y="256" font-size="25" fill="#61e6ed" font-weight="700">v0.1.4</text><text x="430" y="255" font-size="19" fill="#9cacc8" font-weight="400">正式版</text><text x="72" y="300" font-size="27" fill="#f1f5ff" font-weight="700">可配置并发与协调复核</text><rect x="48" y="344" width="744" height="106" rx="18" fill="#101b32" stroke="#61e6ed"/><text x="72" y="378" font-size="25" fill="#61e6ed" font-weight="700">v0.1.5</text><text x="430" y="377" font-size="19" fill="#9cacc8" font-weight="400">正式版</text><text x="72" y="422" font-size="27" fill="#f1f5ff" font-weight="700">资源不足，主动澄清</text><rect x="48" y="466" width="744" height="106" rx="18" fill="#101b32" stroke="#ae91ff"/><text x="72" y="500" font-size="25" fill="#ae91ff" font-weight="700">v0.1.6</text><text x="430" y="499" font-size="19" fill="#9cacc8" font-weight="400">开发中，未发布</text><text x="72" y="544" font-size="27" fill="#f1f5ff" font-weight="700">分阶段测试经验与短索引</text><text x="48" y="623" font-size="19" fill="#9cacc8" font-weight="400">完整历史保留在版本演变文档中；图为能力示意。</text></g></svg>