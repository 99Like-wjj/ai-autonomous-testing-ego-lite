<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-label="自适应测试流程"><title>自适应测试流程</title><defs><linearGradient id="g"><stop stop-color="#61e6ed"/><stop offset="1" stop-color="#ae91ff"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#61e6ed"/></marker></defs><g font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="780" rx="0" fill="#080e20" stroke="#080e20"/><path d="M0,2 H1200" stroke="url(#g)" stroke-width="4"/><text x="50" y="65" font-size="34" fill="#f1f5ff" font-weight="700">目标和规则不变，操作方法灵活调整。</text><text x="50" y="103" font-size="20" fill="#9cacc8" font-weight="400">两种用例来源，一套格式；共同用于新功能与回归验证。</text><rect x="50" y="130" width="535" height="84" rx="18" fill="#101b32" stroke="#293957"/><text x="70" y="162" font-size="21" fill="#61e6ed" font-weight="700">接收已有用例 → 校验格式</text><text x="70" y="193" font-size="17" fill="#9cacc8" font-weight="400">业务步骤 + 有依据的独立目标</text><rect x="615" y="130" width="535" height="84" rx="18" fill="#101b32" stroke="#293957"/><text x="635" y="162" font-size="21" fill="#ae91ff" font-weight="700">AI 根据需求生成用例 → 校验格式</text><text x="635" y="193" font-size="17" fill="#9cacc8" font-weight="400">描述业务步骤，不编造按钮和页面细节</text><g transform="translate(0 120)"><rect x="50" y="160" width="245" height="160" rx="18" fill="#101b32" stroke="#293957"/><text x="74" y="201" font-size="17" fill="#61e6ed" font-weight="400">01</text><text x="74" y="244" font-size="30" fill="#f1f5ff" font-weight="700">观察</text><text x="74" y="285" font-size="18" fill="#9cacc8" font-weight="400">读取当前状态</text><path d="M297,240 L332,240" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="335" y="160" width="245" height="160" rx="18" fill="#101b32" stroke="#293957"/><text x="359" y="201" font-size="17" fill="#61e6ed" font-weight="400">02</text><text x="359" y="244" font-size="30" fill="#f1f5ff" font-weight="700">判断</text><text x="359" y="285" font-size="18" fill="#9cacc8" font-weight="400">选择下一步</text><path d="M582,240 L617,240" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="620" y="160" width="245" height="160" rx="18" fill="#101b32" stroke="#293957"/><text x="644" y="201" font-size="17" fill="#61e6ed" font-weight="400">03</text><text x="644" y="244" font-size="30" fill="#f1f5ff" font-weight="700">行动</text><text x="644" y="285" font-size="18" fill="#9cacc8" font-weight="400">使用 Ego 原生操作</text><path d="M867,240 L902,240" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="905" y="160" width="245" height="160" rx="18" fill="#101b32" stroke="#293957"/><text x="929" y="201" font-size="17" fill="#61e6ed" font-weight="400">04</text><text x="929" y="244" font-size="30" fill="#f1f5ff" font-weight="700">验证</text><text x="929" y="285" font-size="18" fill="#9cacc8" font-weight="400">对照验收条件</text><path d="M1027,324 V368 H173 V324" fill="none" stroke="#ae91ff" stroke-width="2"/><text x="345" y="400" font-size="21" fill="#ae91ff" font-weight="400">证据不足时，由 AI 决定补充验证或说明无法判断。</text><rect x="50" y="443" width="1100" height="172" rx="18" fill="#101b32" stroke="#293957"/><text x="78" y="484" font-size="24" fill="#61e6ed" font-weight="700">每个测试目标，都要有交代</text><text x="78" y="524" font-size="20" fill="#f1f5ff" font-weight="400">分别说明已验证、发现违反、无法判断和未测试。</text><text x="78" y="558" font-size="18" fill="#9cacc8" font-weight="400">缺少账号、数据或授权，主动澄清；独立目标可继续。</text><text x="78" y="590" font-size="18" fill="#9cacc8" font-weight="400">补充后核验再恢复；验收和资源问题分别处理。</text></g></g></svg>