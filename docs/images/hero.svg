<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-label="AI Autonomous Testing · Ego Lite"><title>AI Autonomous Testing · Ego Lite</title><defs><linearGradient id="g"><stop stop-color="#61e6ed"/><stop offset="1" stop-color="#ae91ff"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#61e6ed"/></marker></defs><g font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="540" rx="0" fill="#080e20" stroke="#080e20"/><path d="M0,2 H1200" stroke="url(#g)" stroke-width="4"/><text x="54" y="64" font-size="19" fill="#61e6ed" font-weight="700">AI AUTONOMOUS TESTING / EGO LITE</text><text x="54" y="136" font-size="48" fill="#f1f5ff" font-weight="700">Test new features.</text><text x="54" y="198" font-size="48" fill="#f1f5ff" font-weight="700">Let AI plan the checks.</text><text x="56" y="246" font-size="20" fill="#9cacc8" font-weight="400">New web projects and feature launches. Rules, actions, and evidence.</text><rect x="56" y="294" width="1088" height="150" rx="18" fill="#101b32" stroke="#293957"/><text x="82" y="332" font-size="16" fill="#61e6ed" font-weight="700">01  PREPARE</text><text x="82" y="370" font-size="23" fill="#f1f5ff" font-weight="400">Goals + acceptance</text><text x="82" y="403" font-size="17" fill="#9cacc8" font-weight="400">Requirements and cases</text><text x="455" y="332" font-size="16" fill="#ae91ff" font-weight="700">02  EXPLORE</text><text x="455" y="370" font-size="23" fill="#f1f5ff" font-weight="400">Plan → explore → test</text><text x="455" y="403" font-size="17" fill="#9cacc8" font-weight="400">Current AI session + Ego</text><text x="835" y="332" font-size="16" fill="#61e6ed" font-weight="700">03  REVIEW</text><text x="835" y="370" font-size="23" fill="#f1f5ff" font-weight="400">Evidence + verdict</text><text x="835" y="403" font-size="17" fill="#9cacc8" font-weight="400">Show