<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-label="可配置的并行测试"><title>可配置的并行测试</title><defs><linearGradient id="g"><stop stop-color="#61e6ed"/><stop offset="1" stop-color="#ae91ff"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#61e6ed"/></marker></defs><g font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="580" rx="0" fill="#080e20" stroke="#080e20"/><path d="M0,2 H1200" stroke="url(#g)" stroke-width="4"/><text x="50" y="62" font-size="34" fill="#f1f5ff" font-weight="700">AI 自主协调，分例执行，证据汇总。</text><text x="50" y="104" font-size="20" fill="#9cacc8" font-weight="400">默认逐条执行；用户明确配置后，AI 按独立性与资源条件安排并发。</text><rect x="50" y="160" width="340" height="240" rx="18" fill="#101b32" stroke="#293957"/><text x="72" y="206" font-size="23" fill="#61e6ed" font-weight="700">协调 AI</text><text x="72" y="259" font-size="19" fill="#f1f5ff" font-weight="400">目标与用户并发上限</text><text x="72" y="302" font-size="19" fill="#f1f5ff" font-weight="400">判断独立性与共享状态</text><text x="72" y="345" font-size="19" fill="#f1f5ff" font-weight="400">登记名额与资源关联</text><path d="M393,282 L428,282" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="430" y="160" width="340" height="240" rx="18" fill="#101b32" stroke="#293957"/><text x="452" y="206" font-size="23" fill="#ae91ff" font-weight="700">用例 worker + Ego</text><text x="452" y="259" font-size="19" fill="#f1f5ff" font-weight="400">单用例关联一个 Space</text><text x="452" y="302" font-size="19" fill="#f1f5ff" font-weight="400">保留偏差、错误与证据</text><text x="452" y="345" font-size="19" fill="#f1f5ff" font-weight="400">封存各自的交付包</text><path d="M773,282 L808,282" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="810" y="160" width="340" height="240" rx="18" fill="#101b32" stroke="#293957"/><text x="832" y="206" font-size="23" fill="#61e6ed" font-weight="700">复核与报告</text><text x="832" y="259" font-size="19" fill="#f1f5ff" font-weight="400">AI 按目标复核证据</text><text x="832" y="302" font-size="19" fill="#f1f5ff" font-weight="400">串行导入公共记录</text><text x="832" y="345" font-size="19" fill="#f1f5ff" font-weight="400">HTML / JSON / Markdown</text><text x="50" y="454" font-size="20" fill="#61e6ed" font-weight="400">工具记录状态与文件，不替 AI 调度业务动作或判断缺陷。</text><text x="50" y="498" font-size="19" fill="#9cacc8" font-weight="400">Space 不等于账号隔离或后端数据隔离；并发上限不保证跑满。</text><text x="50" y="542" font-size="16" fill="#9cacc8" font-weight="400">0.1.7-rc.1  /  沿用并发模型；能力示意，非实测证据</text></g></svg>