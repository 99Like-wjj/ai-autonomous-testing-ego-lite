<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1170" viewBox="0 0 1400 1170" role="img" aria-label="AI 主导测试，工具提供能力。"><title>AI 主导测试，工具提供能力。</title><defs><linearGradient id="g"><stop stop-color="#61e6ed"/><stop offset="1" stop-color="#ae91ff"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#61e6ed"/></marker></defs><g font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1400" height="1170" rx="0" fill="#080e20" stroke="#080e20"/><path d="M0,2 H1400" stroke="url(#g)" stroke-width="4"/><text x="60" y="65" font-size="20" fill="#61e6ed" font-weight="700">设计理念</text><text x="60" y="121" font-size="46" fill="#f1f5ff" font-weight="700">AI 主导测试，工具提供能力。</text><text x="60" y="161" font-size="24" fill="#9cacc8" font-weight="400">固定要求，开放方法；不把业务测试写成固定决策树。</text><rect x="100" y="205" width="580" height="90" rx="18" fill="#101b32" stroke="#ae91ff"/><rect x="720" y="205" width="580" height="90" rx="18" fill="#101b32" stroke="#61e6ed"/><text x="125" y="242" font-size="26" fill="#ae91ff" font-weight="700">需求目标 · 验收标准 · 授权边界</text><text x="125" y="275" font-size="20" fill="#9cacc8" font-weight="400">明确要验证什么，以及允许做什么</text><text x="745" y="242" font-size="26" fill="#61e6ed" font-weight="700">项目知识 · 可选上下文</text><text x="745" y="275" font-size="20" fill="#9cacc8" font-weight="400">功能入口 · 项目规则 · 账号与配置</text><g data-diagram-role="knowledge-input-to-ai"><path d="M390,295 L500,328" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1010,295 L900,328" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/></g><rect x="330" y="330" width="740" height="170" rx="18" fill="#101b32" stroke="#61e6ed"/><text x="592" y="381" font-size="36" fill="#61e6ed" font-weight="700">AI 主导测试</text><text x="425" y="424" font-size="25" fill="#f1f5ff" font-weight="400">理解需求 · 设计用例 · 自主探索 · 判断结果</text><text x="424" y="465" font-size="23" fill="#9cacc8" font-weight="400">选择工具、组合能力，并根据真实证据调整方法</text><path d="M700,518 L700,554" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M700,550 L700,514" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="730" y="544" font-size="19" fill="#61e6ed" font-weight="400">按需调用 ↔ 事实反馈</text><path d="M170 575 H1230" stroke="#293957" stroke-width="2" fill="none"/><path d="M170,587 L170,618" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M170,614 L170,583" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="50" y="635" width="240" height="136" rx="18" fill="#101b32" stroke="#293957"/><text x="116" y="674" font-size="26" fill="#61e6ed" font-weight="700">浏览器操作</text><text x="110" y="711" font-size="20" fill="#9cacc8" font-weight="400">Ego 原生能力</text><text x="80" y="747" font-size="18" fill="#f1f5ff" font-weight="400">读取页面与执行动作</text><path d="M435,587 L435,618" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M435,614 L435,583" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="315" y="635" width="240" height="136" rx="18" fill="#101b32" stroke="#293957"/><text x="381" y="674" font-size="26" fill="#ae91ff" font-weight="700">记录与证据</text><text x="375" y="711" font-size="20" fill="#9cacc8" font-weight="400">本项目工具</text><text x="345" y="747" font-size="18" fill="#f1f5ff" font-weight="400">保存事实与证据关联</text><path d="M700,587 L700,618" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M700,614 L700,583" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="580" y="635" width="240" height="136" rx="18" fill="#101b32" stroke="#293957"/><text x="646" y="674" font-size="26" fill="#ae91ff" font-weight="700">接口观测</text><text x="640" y="711" font-size="20" fill="#9cacc8" font-weight="400">本项目工具</text><text x="610" y="747" font-size="18" fill="#f1f5ff" font-weight="400">按授权采集与查询</text><path d="M965,587 L965,618" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M965,614 L965,583" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="845" y="635" width="240" height="136" rx="18" fill="#101b32" stroke="#293957"/><text x="911" y="674" font-size="26" fill="#ae91ff" font-weight="700">回归资料</text><text x="905" y="711" font-size="20" fill="#9cacc8" font-weight="400">本项目工具</text><text x="875" y="747" font-size="18" fill="#f1f5ff" font-weight="400">用例版本与运行比较</text><path d="M1230,587 L1230,618" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1230,614 L1230,583" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="1110" y="635" width="240" height="136" rx="18" fill="#101b32" stroke="#293957"/><text x="1176" y="674" font-size="26" fill="#ae91ff" font-weight="700">报告生成</text><text x="1170" y="711" font-size="20" fill="#9cacc8" font-weight="400">本项目工具</text><text x="1140" y="747" font-size="18" fill="#f1f5ff" font-weight="400">组织事实、证据与结果</text><text x="308" y="817" font-size="23" fill="#9cacc8" font-weight="400">工具做好具体操作与确定性记录，不替 AI 选择业务路线或判定业务正确性。</text><text x="365" y="862" font-size="23" fill="#f1f5ff" font-weight="400">方法可以调整，目标、必要依赖、验收标准与授权不能擅自改变。</text><path d="M50 893 H1350" stroke="#293957" stroke-width="1" stroke-dasharray="6 7"/><text x="50" y="924" font-size="22" fill="#61e6ed" font-weight="700">知识来源说明：为上方 AI 输入提供项目上下文</text><text x="50" y="963" font-size="23" fill="#61e6ed" font-weight="700">可选项目上下文 · 不经维护端代理查询</text><rect x="50" y="986" width="406.6666666666667" height="100" rx="18" fill="#101b32" stroke="#293957"/><text x="66" y="1023" font-size="18" fill="#f1f5ff" font-weight="700">项目知识库维护 Skill</text><text x="66" y="1062" font-size="17" fill="#9cacc8" font-weight="400">创建 · 维护 · 更新</text><path d="M460.6666666666667,1037 L489.6666666666667,1037" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="496.6666666666667" y="986" width="406.6666666666667" height="100" rx="18" fill="#101b32" stroke="#293957"/><text x="512.6666666666667" y="1023" font-size="18" fill="#ae91ff" font-weight="700">独立项目知识库</text><text x="512.6666666666667" y="1062" font-size="17" fill="#9cacc8" font-weight="400">私有知识资产，保存在源码仓库外</text><path d="M907.3333333333334,1037 L936.3333333333334,1037" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="943.3333333333334" y="986" width="406.6666666666667" height="100" rx="18" fill="#101b32" stroke="#293957"/><text x="959.3333333333334" y="1023" font-size="18" fill="#f1f5ff" font-weight="700">Ego 直接按需读取</text><text x="959.3333333333334" y="1062" font-size="17" fill="#9cacc8" font-weight="400">检查 · 查询 · 读取</text><text x="50" y="1122" font-size="19" fill="#9cacc8" font-weight="400">AI 判断来源与适用性；通用测试经验留在 Ego，项目规则不混写。</text></g></svg>