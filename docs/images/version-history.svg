<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1110" viewBox="0 0 840 1110" role="img" aria-label="Version history — capability illustration"><title>Version history — capability illustration</title><defs><linearGradient id="g"><stop stop-color="#61e6ed"/><stop offset="1" stop-color="#ae91ff"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#61e6ed"/></marker></defs><g font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="840" height="1110" rx="0" fill="#080e20" stroke="#080e20"/><path d="M0,2 H840" stroke="url(#g)" stroke-width="4"/><text x="48" y="72" font-size="38" fill="#f1f5ff" font-weight="700">How the Skill evolves</text><text x="48" y="111" font-size="23" fill="#9cacc8" font-weight="400">Released history · Times in Asia/Shanghai</text><path d="M67,186 L67,735" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><circle cx="67" cy="185" r="9" fill="#61e6ed"/><rect x="100" y="148" width="692" height="186" rx="18" fill="#101b32" stroke="#293957"/><text x="126" y="186" font-size="29" fill="#61e6ed" font-weight="700">v0.1.2</text><text x="446" y="184" font-size="21" fill="#9cacc8" font-weight="400">PRERELEASE · 10-22</text><text x="126" y="230" font-size="31" fill="#f1f5ff" font-weight="700">Business-intent steps</text><text x="126" y="271" font-size="25" fill="#9cacc8" font-weight="400">Actions describe the business goal.</text><text x="126" y="305" font-size="25" fill="#9cacc8" font-weight="400">Unclear acceptance stays unresolved.</text><circle cx="67" cy="394" r="9" fill="#61e6ed"/><rect x="100" y="357" width="692" height="186" rx="18" fill="#101b32" stroke="#293957"/><text x="126" y="395" font-size="29" fill="#61e6ed" font-weight="700">v0.1.3</text><text x="446" y="393" font-size="21" fill="#9cacc8" font-weight="400">RELEASED · 10-23</text><text x="126" y="439" font-size="31" fill="#f1f5ff" font-weight="700">Evidence-rich delivery</text><text x="126" y="480" font-size="25" fill="#9cacc8" font-weight="400">Keep evidence and earlier attempts.</text><text x="126" y="514" font-size="25" fill="#9cacc8" font-weight="400">HTML / JSON / Markdown</text><circle cx="67" cy="603" r="9" fill="#61e6ed"/><rect x="100" y="566" width="692" height="186" rx="18" fill="#101b32" stroke="#293957"/><text x="126" y="604" font-size="29" fill="#61e6ed" font-weight="700">v0.1.4</text><text x="446" y="602" font-size="21" fill="#9cacc8" font-weight="400">RELEASED · 10-24</text><text x="126" y="648" font-size="31" fill="#f1f5ff" font-weight="700">Configurable concurrency</text><text x="126" y="689" font-size="25" fill="#9cacc8" font-weight="400">Workers deliver; AI reviews goals.</text><text x="126" y="723" font-size="25" fill="#9cacc8" font-weight="400">Serial by default. Spaces are not isolation.</text><text x="48" y="805" font-size="24" fill="#ae91ff" font-weight="700">v0.1.5 · RELEASE</text><rect x="48" y="830" width="744" height="200" rx="18" fill="#101b32" stroke="#ae91ff" stroke-dasharray="8 6"/><text x="74" y="874" font-size="32" fill="#ae91ff" font-weight="700">v0.1.5</text><text x="74" y="918" font-size="32" fill="#f1f5ff" font-weight="700">Clarify missing resources</text><text x="74" y="960" font-size="25" fill="#9cacc8" font-weight="400">Pause affected actions; verify before resuming.</text><text x="74" y="997" font-size="25" fill="#9cacc8" font-weight="400">Scoped checks verified; broader use untested.</text><text x="48" y="1075" font-size="23" fill="#9cacc8" font-weight="400">Illustration only. See version cards for limits.</text></g></svg>