<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="方案 B 报告阅读 — 能力示意"><title>方案 B 报告阅读 — 能力示意</title><defs><linearGradient id="g"><stop stop-color="#61e6ed"/><stop offset="1" stop-color="#ae91ff"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#61e6ed"/></marker></defs><g font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="760" rx="0" fill="#080e20" stroke="#080e20"/><path d="M0,2 H1200" stroke="url(#g)" stroke-width="4"/><text x="50" y="52" font-size="18" fill="#ae91ff" font-weight="700">0.1.7 / 布局示意，非真实报告截图</text><text x="50" y="103" font-size="32" fill="#f1f5ff" font-weight="700">先看问题与预期，再对照实际步骤和证据。</text><rect x="50" y="134" width="1100" height="120" rx="18" fill="#101b32" stroke="#293957"/><text x="76" y="174" font-size="25" fill="#f1f5ff" font-weight="700">问题：筛选结果中出现了其他分类的商品。</text><text x="76" y="215" font-size="21" fill="#9cacc8" font-weight="400">原预期：当前可见商品均属于所选分类。</text><rect x="50" y="278" width="530" height="280" rx="18" fill="#101b32" stroke="#293957"/><rect x="602" y="278" width="548" height="280" rx="18" fill="#101b32" stroke="#293957"/><text x="76" y="318" font-size="20" fill="#61e6ed" font-weight="700">实际步骤 / 当前选中目标</text><text x="76" y="364" font-size="23" fill="#f1f5ff" font-weight="400">1. 选择分类 A。</text><rect x="70" y="385" width="490" height="85" rx="18" fill="#080e20" stroke="#ae91ff"/><text x="88" y="419" font-size="23" fill="#ae91ff" font-weight="700">2. 读取当前结果。</text><text x="88" y="451" font-size="20" fill="#f1f5ff" font-weight="400">发现一条分类 B 的商品。</text><text x="76" y="514" font-size="19" fill="#9cacc8" font-weight="400">不把计划步骤补成实际经过。</text><text x="628" y="318" font-size="20" fill="#61e6ed" font-weight="700">所选步骤的证据</text><rect x="628" y="342" width="496" height="128" rx="18" fill="#080e20" stroke="#293957"/><text x="650" y="388" font-size="23" fill="#f1f5ff" font-weight="400">页面截图 / 支持材料</text><text x="650" y="428" font-size="20" fill="#9cacc8" font-weight="400">示意占位，不是真实证据</text><text x="628" y="514" font-size="19" fill="#9cacc8" font-weight="400">共享资料、关联范围及缺口明确说明。</text><rect x="50" y="582" width="1100" height="104" rx="18" fill="#101b32" stroke="#293957"/><text x="76" y="622" font-size="22" fill="#61e6ed" font-weight="400">范围说明 ▸ 任务 / 规则明细 ▸ 原始记录与历史</text><text x="76" y="660" font-size="20" fill="#9cacc8" font-weight="400">阅读整理仅组织有来源的事实，不改写业务四态。</text><text x="50" y="733" font-size="18" fill="#9cacc8" font-weight="400">纯合成示意；不代表真实产品执行、缺陷或基准测试。</text></g></svg>