<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="证据展示示意，非真实运行结果"><title>证据展示示意，非真实运行结果</title><defs><linearGradient id="g"><stop stop-color="#61e6ed"/><stop offset="1" stop-color="#ae91ff"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#61e6ed"/></marker></defs><g font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="620" rx="0" fill="#080e20" stroke="#080e20"/><path d="M0,2 H1200" stroke="url(#g)" stroke-width="4"/><text x="50" y="59" font-size="18" fill="#ae91ff" font-weight="700">ILLUSTRATIVE / NOT A REAL RUN</text><text x="50" y="109" font-size="33" fill="#f1f5ff" font-weight="700">可信结果，不只是一枚绿色徽章。</text><rect x="50" y="145" width="1100" height="395" rx="18" fill="#101b32" stroke="#293957"/><text x="78" y="190" font-size="24" fill="#f1f5ff" font-weight="700">用例  /  商品目录搜索</text><text x="78" y="228" font-size="20" fill="#9cacc8" font-weight="400">预期：当前可见结果均符合请求的分类。</text><rect x="78" y="261" width="500" height="188" rx="18" fill="#080e20" stroke="#293957"/><text x="100" y="300" font-size="15" fill="#61e6ed" font-weight="700">观察所得</text><text x="100" y="342" font-size="23" fill="#f1f5ff" font-weight="400">结果列表已显示。</text><text x="100" y="381" font-size="20" fill="#9cacc8" font-weight="400">已检查当前可见的标签。</text><text x="100" y="418" font-size="17" fill="#9cacc8" font-weight="400">证据引用：已脱敏的页面记录</text><rect x="602" y="261" width="520" height="188" rx="18" fill="#080e20" stroke="#293957"/><text x="624" y="300" font-size="15" fill="#ae91ff" font-weight="700">尚未证实</text><text x="624" y="342" font-size="23" fill="#f1f5ff" font-weight="400">后端数据是否正确。</text><text x="624" y="381" font-size="20" fill="#9cacc8" font-weight="400">未显示或位于后续分页的记录。</text><text x="624" y="418" font-size="17" fill="#9cacc8" font-weight="400">没有证据，不扩大结论</text><text x="78" y="496" font-size="22" fill="#61e6ed" font-weight="400">结论：验收证据充分之前，仍需复核。</text><text x="50" y="583" font-size="17" fill="#9cacc8" font-weight="400">仅为人工设计示意，不代表产品实测、真实截图或基准测试。</text></g></svg>