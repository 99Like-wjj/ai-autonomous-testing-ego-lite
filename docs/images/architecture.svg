<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="Who owns what?"><title>Who owns what?</title><defs><linearGradient id="g"><stop stop-color="#61e6ed"/><stop offset="1" stop-color="#ae91ff"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#61e6ed"/></marker></defs><g font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="650" rx="0" fill="#080e20" stroke="#080e20"/><path d="M0,2 H1200" stroke="url(#g)" stroke-width="4"/><text x="50" y="65" font-size="35" fill="#f1f5ff" font-weight="700">A small skill. Clear boundaries.</text><text x="50" y="103" font-size="20" fill="#9cacc8" font-weight="400">No second model service. No browser engine inside the helper.</text><rect x="430" y="150" width="340" height="268" rx="18" fill="#101b32" stroke="#293957"/><text x="454" y="192" font-size="20" fill="#61e6ed" font-weight="700">02</text><text x="454" y="236" font-size="22" fill="#f1f5ff" font-weight="700">Current Codex model</text><text x="454" y="284" font-size="19" fill="#9cacc8" font-weight="400">Interprets the requirement</text><text x="454" y="322" font-size="19" fill="#9cacc8" font-weight="400">Chooses the next action</text><text x="454" y="360" font-size="19" fill="#9cacc8" font-weight="400">Evaluates evidence</text><rect x="50" y="150" width="340" height="268" rx="18" fill="#101b32" stroke="#293957"/><text x="74" y="192" font-size="20" fill="#ae91ff" font-weight="700">01</text><text x="74" y="236" font-size="22" fill="#f1f5ff" font-weight="700">Skill + project resources</text><text x="74" y="284" font-size="19" fill="#9cacc8" font-weight="400">Boundaries and acceptance</text><text x="74" y="322" font-size="19" fill="#9cacc8" font-weight="400">Fixtures and reusable context</text><text x="74" y="360" font-size="19" fill="#9cacc8" font-weight="400">Optional artifact helper</text><rect x="810" y="150" width="340" height="268" rx="18" fill="#101b32" stroke="#293957"/><text x="834" y="192" font-size="20" fill="#61e6ed" font-weight="700">03</text><text x="834" y="236" font-size="22" fill="#f1f5ff" font-weight="700">Ego native browser</text><text x="834" y="284" font-size="19" fill="#9cacc8" font-weight="400">Reads the current page</text><text x="834" y="322" font-size="19" fill="#9cacc8" font-weight="400">Performs browser actions</text><text x="834" y="360" font-size="19" fill="#9cacc8" font-weight="400">Returns observations</text><path d="M390,276 L428,276" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M770,260 L808,260" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M808,302 L770,302" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="78" y="444" font-size="16" fill="#ae91ff" font-weight="400">Provides context →</text><text x="454" y="444" font-size="16" fill="#61e6ed" font-weight="400">Decisions ↔ browser observations</text><rect x="50" y="462" width="1100" height="130" rx="18" fill="#101b32" stroke="#293957"/><text x="78" y="503" font-size="23" fill="#61e6ed" font-weight="700">The helper owns files, not decisions.</text><text x="78" y="543" font-size="21" fill="#f1f5ff" font-weight="400">init / start / check / report never launch a model or a browser.</text><text x="78" y="574" font-size="18" fill="#9cacc8" font-weight="400">Observed UI state is evidence, not an independent business oracle.</text></g></svg>