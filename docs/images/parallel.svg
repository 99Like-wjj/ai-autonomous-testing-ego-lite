<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-label="Configurable parallel testing"><title>Configurable parallel testing</title><defs><linearGradient id="g"><stop stop-color="#61e6ed"/><stop offset="1" stop-color="#ae91ff"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#61e6ed"/></marker></defs><g font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="580" rx="0" fill="#080e20" stroke="#080e20"/><path d="M0,2 H1200" stroke="url(#g)" stroke-width="4"/><text x="50" y="62" font-size="34" fill="#f1f5ff" font-weight="700">AI coordinates. Workers deliver evidence.</text><text x="50" y="104" font-size="20" fill="#9cacc8" font-weight="400">Default: one case at a time. Parallelism requires explicit configuration.</text><rect x="50" y="160" width="340" height="240" rx="18" fill="#101b32" stroke="#293957"/><text x="72" y="206" font-size="23" fill="#61e6ed" font-weight="700">Coordinator AI</text><text x="72" y="259" font-size="19" fill="#f1f5ff" font-weight="400">Goals and user limits</text><text x="72" y="302" font-size="19" fill="#f1f5ff" font-weight="400">Judge independence</text><text x="72" y="345" font-size="19" fill="#f1f5ff" font-weight="400">Reserve resources</text><path d="M393,282 L428,282" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="430" y="160" width="340" height="240" rx="18" fill="#101b32" stroke="#293957"/><text x="452" y="206" font-size="23" fill="#ae91ff" font-weight="700">Case workers + Ego</text><text x="452" y="259" font-size="19" fill="#f1f5ff" font-weight="400">One Space per case</text><text x="452" y="302" font-size="19" fill="#f1f5ff" font-weight="400">Record deviations</text><text x="452" y="345" font-size="19" fill="#f1f5ff" font-weight="400">Seal evidence packets</text><path d="M773,282 L808,282" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="810" y="160" width="340" height="240" rx="18" fill="#101b32" stroke="#293957"/><text x="832" y="206" font-size="23" fill="#61e6ed" font-weight="700">Review + report</text><text x="832" y="259" font-size="19" fill="#f1f5ff" font-weight="400">AI reviews evidence</text><text x="832" y="302" font-size="19" fill="#f1f5ff" font-weight="400">Serial data imports</text><text x="832" y="345" font-size="19" fill="#f1f5ff" font-weight="400">HTML / JSON / Markdown</text><text x="50" y="454" font-size="20" fill="#61e6ed" font-weight="400">Toolbox records state; it does not schedule business actions or decide bugs.</text><text x="50" y="498" font-size="19" fill="#9cacc8" font-weight="400">Spaces do not guarantee separate accounts or backend data.</text><text x="50" y="542" font-size="16" fill="#9cacc8" font-weight="400">0.1.7  /  Retained concurrency model · Illustration only</text></g></svg>