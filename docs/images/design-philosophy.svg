<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-label="AI leads. Tools provide capabilities."><title>AI leads. Tools provide capabilities.</title><defs><linearGradient id="g"><stop stop-color="#61e6ed"/><stop offset="1" stop-color="#ae91ff"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#61e6ed"/></marker></defs><g font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1400" height="900" rx="0" fill="#080e20" stroke="#080e20"/><path d="M0,2 H1400" stroke="url(#g)" stroke-width="4"/><text x="60" y="65" font-size="20" fill="#61e6ed" font-weight="700">DESIGN PHILOSOPHY</text><text x="60" y="121" font-size="46" fill="#f1f5ff" font-weight="700">AI leads. Tools provide capabilities.</text><text x="60" y="161" font-size="24" fill="#9cacc8" font-weight="400">Fixed requirements. Open methods. No fixed business decision tree.</text><rect x="290" y="205" width="820" height="68" rx="18" fill="#101b32" stroke="#ae91ff"/><text x="420" y="248" font-size="26" fill="#ae91ff" font-weight="700">Goals · Acceptance criteria · Authorization</text><path d="M700,283 L700,316" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="330" y="330" width="740" height="170" rx="18" fill="#101b32" stroke="#61e6ed"/><text x="564" y="381" font-size="36" fill="#61e6ed" font-weight="700">AI leads testing</text><text x="372" y="424" font-size="24" fill="#f1f5ff" font-weight="400">Understand · Design · Explore · Evaluate evidence</text><text x="371" y="465" font-size="22" fill="#9cacc8" font-weight="400">Choose tools, combine capabilities, adapt to real evidence</text><path d="M700,518 L700,554" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M700,550 L700,514" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="730" y="544" font-size="19" fill="#61e6ed" font-weight="400">On-demand calls ↔ factual feedback</text><path d="M170 575 H1230" stroke="#293957" stroke-width="2" fill="none"/><path d="M170,587 L170,618" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M170,614 L170,583" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="50" y="635" width="240" height="136" rx="18" fill="#101b32" stroke="#293957"/><text x="66" y="674" font-size="18" fill="#61e6ed" font-weight="700">Browser actions</text><text x="94" y="711" font-size="20" fill="#9cacc8" font-weight="400">Ego native tools</text><text x="66" y="747" font-size="17" fill="#f1f5ff" font-weight="400">Read pages and act</text><path d="M435,587 L435,618" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M435,614 L435,583" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="315" y="635" width="240" height="136" rx="18" fill="#101b32" stroke="#293957"/><text x="331" y="674" font-size="18" fill="#ae91ff" font-weight="700">Records &amp; evidence</text><text x="359" y="711" font-size="20" fill="#9cacc8" font-weight="400">Project toolbox</text><text x="331" y="747" font-size="17" fill="#f1f5ff" font-weight="400">Retain facts and links</text><path d="M700,587 L700,618" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M700,614 L700,583" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="580" y="635" width="240" height="136" rx="18" fill="#101b32" stroke="#293957"/><text x="596" y="674" font-size="18" fill="#ae91ff" font-weight="700">Network observation</text><text x="624" y="711" font-size="20" fill="#9cacc8" font-weight="400">Project toolbox</text><text x="596" y="747" font-size="17" fill="#f1f5ff" font-weight="400">Scoped capture / query</text><path d="M965,587 L965,618" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M965,614 L965,583" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="845" y="635" width="240" height="136" rx="18" fill="#101b32" stroke="#293957"/><text x="861" y="674" font-size="18" fill="#ae91ff" font-weight="700">Regression assets</text><text x="889" y="711" font-size="20" fill="#9cacc8" font-weight="400">Project toolbox</text><text x="861" y="747" font-size="17" fill="#f1f5ff" font-weight="400">Tasks, rules, comparison</text><path d="M1230,587 L1230,618" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M1230,614 L1230,583" stroke="#61e6ed" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="1110" y="635" width="240" height="136" rx="18" fill="#101b32" stroke="#293957"/><text x="1126" y="674" font-size="18" fill="#ae91ff" font-weight="700">Report generation</text><text x="1154" y="711" font-size="20" fill="#9cacc8" font-weight="400">Project toolbox</text><text x="1126" y="747" font-size="17" fill="#f1f5ff" font-weight="400">Present facts / evidence</text><text x="170" y="817" font-size="25" fill="#9cacc8" font-weight="400">Tools handle actions and records; AI owns business routes and judgments.</text><text x="214" y="862" font-size="23" fill="#f1f5ff" font-weight="400">Adapt methods, not goals, dependencies, acceptance criteria or authorization.</text></g></svg>