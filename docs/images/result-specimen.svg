<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="Scheme B report reading — illustration"><title>Scheme B report reading — illustration</title><defs><linearGradient id="g"><stop stop-color="#61e6ed"/><stop offset="1" stop-color="#ae91ff"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#61e6ed"/></marker></defs><g font-family="DejaVu Sans, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1200" height="760" rx="0" fill="#080e20" stroke="#080e20"/><path d="M0,2 H1200" stroke="url(#g)" stroke-width="4"/><text x="50" y="52" font-size="18" fill="#ae91ff" font-weight="700">0.1.7 / SCHEMATIC, NOT A REAL REPORT SCREENSHOT</text><text x="50" y="103" font-size="32" fill="#f1f5ff" font-weight="700">Start with the issue. Read steps beside evidence.</text><rect x="50" y="134" width="1100" height="120" rx="18" fill="#101b32" stroke="#293957"/><text x="76" y="174" font-size="25" fill="#f1f5ff" font-weight="700">Issue: a result belongs to another category.</text><text x="76" y="215" font-size="21" fill="#9cacc8" font-weight="400">Expected: all visible results match the selected category.</text><rect x="50" y="278" width="530" height="280" rx="18" fill="#101b32" stroke="#293957"/><rect x="602" y="278" width="548" height="280" rx="18" fill="#101b32" stroke="#293957"/><text x="76" y="318" font-size="20" fill="#61e6ed" font-weight="700">ACTUAL STEPS / ONE SELECTED GOAL</text><text x="76" y="364" font-size="23" fill="#f1f5ff" font-weight="400">1. Select category A.</text><rect x="70" y="385" width="490" height="85" rx="18" fill="#080e20" stroke="#ae91ff"/><text x="88" y="419" font-size="23" fill="#ae91ff" font-weight="700">2. Inspect visible results.</text><text x="88" y="451" font-size="20" fill="#f1f5ff" font-weight="400">One item is category B.</text><text x="76" y="514" font-size="19" fill="#9cacc8" font-weight="400">No plan is invented as an actual step.</text><text x="628" y="318" font-size="20" fill="#61e6ed" font-weight="700">EVIDENCE FOR THE SELECTED STEP</text><rect x="628" y="342" width="496" height="128" rx="18" fill="#080e20" stroke="#293957"/><text x="650" y="388" font-size="23" fill="#f1f5ff" font-weight="400">Page capture / supporting text</text><text x="650" y="428" font-size="20" fill="#9cacc8" font-weight="400">Illustrative placeholder — not evidence</text><text x="628" y="514" font-size="19" fill="#9cacc8" font-weight="400">Shared material and gaps stay explicit.</text><rect x="50" y="582" width="1100" height="104" rx="18" fill="#101b32" stroke="#293957"/><text x="76" y="622" font-size="22" fill="#61e6ed" font-weight="400">Scope disclosures ▸ task/rule details ▸ original records and history</text><text x="76" y="660" font-size="20" fill="#9cacc8" font-weight="400">Reader notes organize sourced facts; they never rewrite business outcomes.</text><text x="50" y="733" font-size="18" fill="#9cacc8" font-weight="400">Synthetic illustration only. No real product execution or benchmark is claimed.</text></g></svg>